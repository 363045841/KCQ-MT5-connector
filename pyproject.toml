[project]
name = "kcq-mt5-connector"
version = "0.1.0"
description = "KCQ MT5 local terminal market-data connector (Exness) implementing KCQ market-data V1 protocol + SSE realtime bars"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pandas>=2.2",
    "MetaTrader5>=5.0.45 ; sys_platform == 'win32'",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.uv]
package = false
